<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="COSINT privacy architecture: board content flows directly peer-to-peer, end-to-end encrypted; the signaling server only sees opaque handshakes; no TURN relay by design">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="e2e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="400" rx="16" fill="url(#abg)"/>
  <rect x="1" y="1" width="1118" height="398" rx="15" fill="none" stroke="#222c3a" stroke-width="1.5"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <!-- Signaling server (top center) -->
    <g transform="translate(470,34)">
      <rect width="180" height="58" rx="10" fill="#12181f" stroke="#3a3320"/>
      <circle cx="24" cy="29" r="6" fill="#f59e0b"/>
      <text x="42" y="26" fill="#e7c98a" font-size="15" font-weight="700">Signaling</text>
      <text x="42" y="45" fill="#8a8064" font-size="11.5">opaque room id only</text>
    </g>
    <text x="560" y="112" fill="#6f7d8f" font-size="12.5" text-anchor="middle">sees only encrypted handshakes — never your content</text>

    <!-- dashed handshake lines -->
    <g stroke="#7d6f42" stroke-width="2" stroke-dasharray="5 6">
      <line x1="500" y1="92" x2="250" y2="150"/>
      <line x1="620" y1="92" x2="870" y2="150"/>
    </g>

    <!-- Peer A -->
    <g transform="translate(70,150)">
      <rect width="260" height="150" rx="14" fill="#0f1620" stroke="#26313f"/>
      <rect width="260" height="30" rx="14" fill="#141d29"/>
      <rect y="16" width="260" height="14" fill="#141d29"/>
      <circle cx="18" cy="15" r="4" fill="#ef4d4d"/><circle cx="34" cy="15" r="4" fill="#f5b53f"/><circle cx="50" cy="15" r="4" fill="#3fbf6a"/>
      <text x="130" y="19" fill="#8fa0b4" font-size="12" font-weight="600" text-anchor="middle">Analyst A</text>
      <!-- mini graph -->
      <g stroke="#2b3644" stroke-width="1.6">
        <line x1="70" y1="70" x2="150" y2="60"/><line x1="70" y1="70" x2="120" y2="118"/><line x1="150" y1="60" x2="200" y2="100"/>
      </g>
      <circle cx="70" cy="70" r="9" fill="#6366f1"/><circle cx="150" cy="60" r="9" fill="#06b6d4"/>
      <circle cx="120" cy="118" r="9" fill="#10b981"/><circle cx="200" cy="100" r="9" fill="#f59e0b"/>
    </g>

    <!-- Peer B -->
    <g transform="translate(790,150)">
      <rect width="260" height="150" rx="14" fill="#0f1620" stroke="#26313f"/>
      <rect width="260" height="30" rx="14" fill="#141d29"/>
      <rect y="16" width="260" height="14" fill="#141d29"/>
      <circle cx="18" cy="15" r="4" fill="#ef4d4d"/><circle cx="34" cy="15" r="4" fill="#f5b53f"/><circle cx="50" cy="15" r="4" fill="#3fbf6a"/>
      <text x="130" y="19" fill="#8fa0b4" font-size="12" font-weight="600" text-anchor="middle">Analyst B</text>
      <g stroke="#2b3644" stroke-width="1.6">
        <line x1="60" y1="100" x2="110" y2="60"/><line x1="110" y1="60" x2="190" y2="70"/><line x1="110" y1="60" x2="150" y2="118"/>
      </g>
      <circle cx="60" cy="100" r="9" fill="#ec4899"/><circle cx="110" cy="60" r="9" fill="#3b82f6"/>
      <circle cx="190" cy="70" r="9" fill="#06b6d4"/><circle cx="150" cy="118" r="9" fill="#6366f1"/>
    </g>

    <!-- E2E direct link (rect bar — renders reliably everywhere) -->
    <rect x="330" y="222" width="460" height="6" rx="3" fill="#22d3ee"/>
    <g transform="translate(524,203)">
      <rect width="72" height="44" rx="10" fill="#08303a" stroke="#0e7490"/>
      <path d="M25 22 v-4 a11 11 0 0 1 22 0 v4" fill="none" stroke="#22d3ee" stroke-width="2.4"/>
      <rect x="21" y="20" width="30" height="18" rx="4" fill="#22d3ee"/>
      <rect x="34" y="26" width="4" height="7" rx="2" fill="#08303a"/>
    </g>
    <text x="560" y="185" fill="#67e8f9" font-size="14.5" font-weight="700" text-anchor="middle">Board content · WebRTC · AES-GCM</text>
    <text x="560" y="282" fill="#7f8ca0" font-size="13" text-anchor="middle">direct peer ↔ peer — end-to-end encrypted, no server in the middle</text>

    <!-- No TURN relay -->
    <g transform="translate(495,330)">
      <rect width="130" height="46" rx="10" fill="#1a1113" stroke="#4a2530"/>
      <text x="65" y="21" fill="#c98a92" font-size="13" font-weight="700" text-anchor="middle">TURN relay</text>
      <text x="65" y="37" fill="#8a626a" font-size="11" text-anchor="middle">none — by design</text>
      <line x1="10" y1="8" x2="120" y2="38" stroke="#ef4444" stroke-width="2.4"/>
    </g>
  </g>
</svg>
