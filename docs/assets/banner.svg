<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="COSINT — collaborative OSINT investigation board, peer-to-peer, end-to-end encrypted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#1a2432"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="16" fill="url(#dots)"/>
  <rect width="1280" height="380" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="378" rx="15" fill="none" stroke="#222c3a" stroke-width="1.5"/>

