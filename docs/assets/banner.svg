  <!-- ——— Wordmark (left) ——— -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
    <text x="74" y="120" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="2.5">OSINT · P2P · END-TO-END ENCRYPTED</text>
    <text x="70" y="210" fill="#eef4fb" font-size="98" font-weight="700">COSINT</text>
    <text x="74" y="256" fill="#aebdd0" font-size="25" font-weight="600">Map your OSINT case. Together, in real time.</text>
    <text x="74" y="288" fill="#77869a" font-size="18" font-weight="500">Your data never touches a server.</text>

    <g transform="translate(74,308)">
